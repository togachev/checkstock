services:
    db:
        image: postgres:15
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: checkstock
        ports:
            - "5433:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U user -d checkstock"]
            interval: 5s
            timeout: 5s
            retries: 5

    web:
        build: .
        ports:
            - "8000:8000"
        depends_on:
            db:
                condition: service_healthy
        environment:
            - DATABASE_URL=postgresql://user:password@db:5432/checkstock
